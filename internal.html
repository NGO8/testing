<!doctype html>
<html>
  <head>
    <title>Internal CSS Example</title>

    <style>
      h1 {
        color: #333333;
        text-align: center;
      }

      .intro {
        background-color: #e3f2fd;
        padding: 15px;
        border-radius: 8px;
      }

      #hero-title {
        font-size: 48px;
        color: #1976d2;
      }
    </style>
  </head>
  <body>
    <h1 id="hero-title">Welcome to My Website</h1>

    <p class="intro">
      This is an introductory paragraph with a light blue background.
    </p>
  </body>
</html>
